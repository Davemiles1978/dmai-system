services:
  dmai:
    build: .
    ports:
      - "8000:8000"
      - "5001:5001"
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/app/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dmai
      POSTGRES_USER: dmai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmai_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
