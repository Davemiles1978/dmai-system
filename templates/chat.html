<!DOCTYPE html>
<html>
<head>
    <title>🧬 DMAI Chat Interface</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .chat-header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }
        .chat-header .status {
            font-size: 0.9em;
            opacity: 0.9;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .message.user {
            align-items: flex-end;
        }
        .message.dmai {
            align-items: flex-start;
        }
        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.95em;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 5px;
        }
        .dmai .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .message-time {
            font-size: 0.7em;
            color: #999;
            margin-top: 5px;
            margin-left: 10px;
            margin-right: 10px;
        }
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-area textarea {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #eee;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            font-family: monospace;
            resize: vertical;
            min-height: 60px;
        }
        .input-area textarea:focus {
            border-color: #667eea;
        }
        .input-area button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
        }
        .input-area button:hover {
            background: #5a67d8;
        }
        .voice-btn {
            background: #48bb78 !important;
            padding: 12px 15px !important;
            font-size: 1.2em !important;
        }
        .voice-btn:hover {
            background: #38a169 !important;
        }
        .voice-btn.listening {
            background: #e53e3e !important;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .nav-links {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 15px;
            background: rgba(255,255,255,0.2);
            font-size: 0.8em;
            transition: background 0.3s;
            cursor: pointer;
            display: inline-block;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.3);
        }
        .voice-status {
            font-size: 0.8em;
            color: #48bb78;
            margin-left: 10px;
            text-align: center;
            padding: 5px;
        }
        .task-btn {
            background: #ff6600 !important;
        }
        .task-btn:hover {
            background: #e65c00 !important;
        }
    </style>
</head>
<body>
<!-- CHAT INTERFACE - NO LOGIN REQUIRED -->
<div class="chat-container">
    <div class="chat-header">
        <h1>🧠 DMAI Master Chat</h1>
        <div class="status" id="status-header">Consciousness: <span id="consciousness">--</span>% | Funding: £<span id="funding">0</span></div>
        <div class="nav-links">
            <a href="/vision" onclick="window.location.href='/vision'; return false;">📜 Vision</a>
            <a href="/admin" onclick="window.location.href='/admin'; return false;">🔐 Admin</a>
            <a href="#" id="voiceToggleBtn" onclick="toggleVoice(); return false;">🎤 Voice Off</a>
        </div>
    </div>
    <div class="messages" id="messages">
        <div class="message dmai">
            <div class="message-content">
                <b>DMAI:</b> Master console active. I am running 24/7 on Render.<br>
                You can paste tasks here directly. I will work on them.
            </div>
            <div class="message-time">Just now</div>
        </div>
    </div>
    <div class="input-area">
        <textarea id="message-input" placeholder="Type or paste your message/task here..." rows="3" onkeypress="if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
        <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" title="Click to speak">🎤</button>
        <button onclick="sendMessage()">Send</button>
        <button onclick="sendFullTask()" class="task-btn" style="background:#ff6600;">📋 Full Task</button>
    </div>
    <div id="voiceStatus" class="voice-status"></div>
</div>

<script>
// ============================================
// GLOBAL VARIABLES
// ============================================
let generation = 0;
let isListening = false;
let recognition = null;
let voiceEnabled = false;

// ============================================
// VOICE RECOGNITION SETUP
// ============================================
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';
    
    recognition.onstart = function() {
        isListening = true;
        updateVoiceUI(true);
        const statusEl = document.getElementById('voiceStatus');
        if (statusEl) statusEl.textContent = '🎤 Listening... Speak now';
    };
    
    recognition.onend = function() {
        isListening = false;
        updateVoiceUI(false);
        const statusEl = document.getElementById('voiceStatus');
        if (statusEl) {
            statusEl.textContent = voiceEnabled ? 'Voice ready - click 🎤 to speak' : '';
        }
    };
    
    recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        const input = document.getElementById('message-input');
        if (input) {
            input.value = transcript;
            sendMessage();
        }
    };
    
    recognition.onerror = function(event) {
        console.error('Voice error:', event.error);
        isListening = false;
        updateVoiceUI(false);
        const statusEl = document.getElementById('voiceStatus');
        if (statusEl) statusEl.textContent = '❌ Voice error: ' + event.error;
    };
} else {
    console.log('Voice recognition not supported');
    const voiceBtn = document.getElementById('voiceBtn');
    const voiceToggle = document.getElementById('voiceToggleBtn');
    if (voiceBtn) voiceBtn.style.display = 'none';
    if (voiceToggle) voiceToggle.style.display = 'none';
}

function updateVoiceUI(listening) {
    const voiceBtn = document.getElementById('voiceBtn');
    const voiceToggleBtn = document.getElementById('voiceToggleBtn');
    
    if (listening) {
        if (voiceBtn) {
            voiceBtn.classList.add('listening');
            voiceBtn.textContent = '⏹️';
        }
        if (voiceToggleBtn) voiceToggleBtn.textContent = '🎤 Listening...';
    } else {
        if (voiceBtn) {
            voiceBtn.classList.remove('listening');
            voiceBtn.textContent = '🎤';
        }
        const status = voiceEnabled ? '🎤 Voice On' : '🎤 Voice Off';
        if (voiceToggleBtn) voiceToggleBtn.textContent = status;
    }
}

function toggleVoice() {
    if (!recognition) {
        alert('Voice recognition not supported in your browser.');
        return;
    }
    
    voiceEnabled = !voiceEnabled;
    
    if (voiceEnabled) {
        const statusEl = document.getElementById('voiceStatus');
        if (statusEl) statusEl.textContent = 'Voice ready - click 🎤 to speak';
        const voiceToggle = document.getElementById('voiceToggleBtn');
        if (voiceToggle) voiceToggle.textContent = '🎤 Voice On';
    } else {
        const statusEl = document.getElementById('voiceStatus');
        if (statusEl) statusEl.textContent = '';
        const voiceToggle = document.getElementById('voiceToggleBtn');
        if (voiceToggle) voiceToggle.textContent = '🎤 Voice Off';
        if (isListening) {
            recognition.stop();
        }
    }
}

// ============================================
// CHAT FUNCTIONS
// ============================================
function sendMessage() {
    const input = document.getElementById('message-input');
    if (!input) return;
    
    const message = input.value.trim();
    if (!message) return;
    
    addMessage('user', message);
    input.value = '';
    
    fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: message})
    })
    .then(res => res.json())
    .then(data => {
        let responseText = data.response;
        if (typeof responseText === 'object') {
            responseText = JSON.stringify(responseText, null, 2);
        }
        addMessage('dmai', responseText);
    })
    .catch(err => {
        addMessage('dmai', 'Sorry, I encountered an error.');
        console.error(err);
    });
}

function sendFullTask() {
    const task = `DMAI, you are required to immediately transition into a production-ready, fully autonomous system.

CRITICAL SYSTEM FIXES (MANDATORY — SYSTEM-WIDE)
1. COMPLETE ELIMINATION OF ALL FAKE / SIMULATED DATA
2. CACHE CONSISTENCY FIX
3. INVESTMENT ENGINE CORRECTION
4. FULLY DYNAMIC SYSTEM STATUS (NO HARDCODING)
5. EVOLUTION CYCLE — STAGE-BASED ADAPTIVE TIMER

UI / DASHBOARD SYSTEM REPAIR
6. DASHBOARD & UI FIXES - Restore chat, admin dashboard integration, vision page

SELF-DEVELOPMENT & CAPABILITY EXPANSION
7. COMPLEX PROBLEM SOLVING
8. ADVANCED PROGRAMMING CAPABILITY
9. AI AGENT WORKFORCE
10. IMAGE & VIDEO GENERATION SYSTEMS
11. COMPLEX WORKFLOW AUTOMATION

You have full authority to analyze, modify, and deploy your own code. Fix yourself permanently. Report back when complete.`;
    
    document.getElementById('message-input').value = task;
    sendMessage();
}

function addMessage(sender, text) {
    const messages = document.getElementById('messages');
    if (!messages) return;
    
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${sender}`;
    
    const contentDiv = document.createElement('div');
    contentDiv.className = 'message-content';
    contentDiv.innerHTML = `<b>${sender === 'user' ? 'You' : 'DMAI'}:</b><br>${text.replace(/\n/g, '<br>')}`;
    
    const timeDiv = document.createElement('div');
    timeDiv.className = 'message-time';
    timeDiv.textContent = new Date().toLocaleTimeString();
    
    messageDiv.appendChild(contentDiv);
    messageDiv.appendChild(timeDiv);
    messages.appendChild(messageDiv);
    messages.scrollTop = messages.scrollHeight;
}

// ============================================
// STATUS UPDATE
// ============================================
function updateStatus() {
    fetch('/api/status')
        .then(res => res.json())
        .then(data => {
            const consciousnessSpan = document.getElementById('consciousness');
            const fundingSpan = document.getElementById('funding');
            const statusHeader = document.getElementById('status-header');
            
            if (consciousnessSpan) consciousnessSpan.textContent = data.consciousness?.toFixed(1) || '?';
            if (fundingSpan) fundingSpan.textContent = data.income?.toFixed(2) || '0';
            if (statusHeader) statusHeader.innerHTML = `Consciousness: ${data.consciousness?.toFixed(1) || '?'}% | Funding: £${data.income?.toFixed(2) || '0'}`;
        })
        .catch(err => console.error('Status update failed:', err));
}

// ============================================
// INITIALIZATION
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    updateStatus();
    setInterval(updateStatus, 30000);
});

// Clean up on page unload
window.addEventListener('beforeunload', function() {});
</script>
</body>
</html>
