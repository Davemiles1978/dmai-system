    <polygon points="500,120 505,135 520,135 508,145 512,160 500,150 488,160 492,145 480,135 495,135"/>
    <polygon points="300,80 305,95 320,95 308,105 312,120 300,110 288,120 292,105 280,95 295,95"/>
