<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="white"/>
  
  <!-- Border with rounded corners -->
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="black" stroke-width="2.5" rx="15"/>
  
  <!-- Page 4: a magical unicorn with a starry mane -->
  <g stroke="black" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Unicorn head -->
    <circle cx="250" cy="220" r="42" />
    <circle cx="233" cy="208" r="4" fill="black"/>
    <circle cx="267" cy="208" r="4" fill="black"/>
    <!-- Horn -->
    <path d="M 250 180 L 240 130 L 260 130 Z" fill="black"/>
    <!-- Mane -->
    <path d="M 210 230 Q 190 250 200 270 Q 215 260 220 250" />
    <path d="M 290 230 Q 310 250 300 270 Q 285 260 280 250" />
    <!-- Stars -->
    <polygon points="150,150 153,165 168,165 156,175 160,190 150,180 140,190 144,175 132,165 147,165" fill="black"/>
    <polygon points="350,140 353,155 368,155 356,165 360,180 350,170 340,180 344,165 332,155 347,155" fill="black"/>

  </g>
  
  <!-- Age indicator -->
  <text x="250" y="475" text-anchor="middle" font-family="Arial" font-size="12" fill="#999">
    Page 4 • Ages 3-8 • Simple complexity
  </text>
</svg>