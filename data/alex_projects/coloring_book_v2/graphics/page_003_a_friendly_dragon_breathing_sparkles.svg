<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="white"/>
  
  <!-- Border with rounded corners -->
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="black" stroke-width="2.5" rx="15"/>
  
  <!-- Page 3: a friendly dragon breathing sparkles -->
  <g stroke="black" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Dragon head -->
    <circle cx="250" cy="200" r="40" />
    <circle cx="235" cy="188" r="4" fill="black"/>
    <circle cx="265" cy="188" r="4" fill="black"/>
    <!-- Dragon horns -->
    <path d="M 230 165 L 215 140 L 240 155" />
    <path d="M 270 165 L 285 140 L 260 155" />
    <!-- Wings -->
    <path d="M 210 240 Q 150 200 180 280 Q 190 300 210 290" />
    <path d="M 290 240 Q 350 200 320 280 Q 310 300 290 290" />
    <!-- Fire -->
    <path d="M 250 240 Q 240 260 250 270 Q 260 260 250 240" />

  </g>
  
  <!-- Age indicator -->
  <text x="250" y="475" text-anchor="middle" font-family="Arial" font-size="12" fill="#999">
    Page 3 • Ages 3-8 • Simple complexity
  </text>
</svg>