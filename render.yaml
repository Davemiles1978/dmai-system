services:
  - type: web
    name: dmai-system
    runtime: python
    repo: https://github.com/Davemiles1978/dmai-system
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python -c "from pathlib import Path; [p.mkdir(parents=True, exist_ok=True) for p in [Path('logs'), Path('data'), Path('components'), Path('templates')]]"
    startCommand: python3 dmai_web.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: MASTER_PASSWORD
        value: Talula.78
      - key: TELEGRAM_BOT_TOKEN
        sync: false  # Set in Render dashboard
      - key: TELEGRAM_CHAT_ID
        sync: false  # Set in Render dashboard
      - key: MIROFISH_ENABLED
        value: true
      - key: RENDER
        value: true
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard
      - key: USE_POSTGRESQL
        value: "true"

  - type: worker
    name: dmai-telegram
    runtime: python
    repo: https://github.com/Davemiles1978/dmai-system
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python3 telegram_master_control.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
