services:
  - type: web
    name: dmai-web
    env: python
    buildCommand: pip install -r requirements.txt
    # Phase 12: delegate all worker config to gunicorn_config.py (16 threads,
    # max_requests=0 so background daemon threads survive). Inline flags here
    # would override the config file and reintroduce worker recycling.
    startCommand: gunicorn dmai_core_complete:app --config gunicorn_config.py
    healthCheckPath: /health
    healthCheckGracePeriodSeconds: 180
    # Persistent disk so dmai_knowledge.db survives deploys/restarts.
    # Was on ephemeral overlayfs which (a) wiped DB on every deploy and
    # (b) has unsafe fsync semantics for SQLite WAL. See
    # DB_CORRUPTION_AUDIT_2026-06-27.md.
    disk:
      name: dmai-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:

      # ── Core System ──────────────────────────────────────────
      - key: PORT
        value: "10000"
      - key: RENDER
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: DATA_PATH
        value: /opt/render/project/src/data
      - key: DB_AUTO_HEAL
        value: "true"
      # Kaizen auto-repair loop — currently disabled because previous attempt
      # triggered worker starvation on Render. SelfHealer handles thread
      # restarts; AI-driven code repair stays gated until the kaizen worker
      # starvation issue is fully characterised. Enable via Render dashboard
      # to flip on without a redeploy when ready.
      - key: KAIZEN_AUTO_REPAIR_ENABLED
        value: "false"
      - key: MASTER_PASSWORD
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: WEBHOOK_SECRET
        sync: false

      - key: TAVILY_API_KEY
        sync: false

      # ── Free-tier AI Providers (zero cost to activate) ───────────────────
      - key: GROQ_API_KEY
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false

      - key: CLOUDFLARE_API_KEY
        sync: false

      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false

      - key: BRAVE_SEARCH_API_KEY
        sync: false



      - key: BRAVE_SEARCH_API_KEY
        sync: false

      # ── Database ─────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false

      # ── Telegram ─────────────────────────────────────────────
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

      # ── AI Providers — Existing ───────────────────────────────
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: GOOGLE_AI_STUDIO_KEY
        sync: false
      - key: NOTEBOOKLM_API_KEY
        sync: false
      - key: IMAGEN_API_KEY
        sync: false
      - key: GEMINI_GEMS_KEY
        sync: false

      # ── AI Providers — New Extended Hub ──────────────────────
      - key: MISTRAL_API_KEY
        sync: false

      # ── AI Providers — Free-tier expansion (June 2026) ──────────
      - key: CEREBRAS_API_KEY
        sync: false

      - key: GITHUB_MODELS_TOKEN
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: RUNWAY_API_KEY
        sync: false
      - key: REPLICATE_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false

      # ── GitHub ───────────────────────────────────────────────
      - key: GITHUB_TOKEN_MAIN
        sync: false
      - key: GITHUB_TOKEN_SECONDARY
        sync: false

      # ── Vector DB (Pinecone) ──────────────────────────────────
      - key: PINECONE_INDEX
        sync: false
      - key: PINECONE_ENVIRONMENT
        sync: false

      # ── Trading (Alpaca) ──────────────────────────────────────
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets

      # ── AWS ───────────────────────────────────────────────────
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1

      # ── Content / Publishing ──────────────────────────────────
      - key: KDP_EMAIL
        sync: false
      - key: KDP_PASSWORD
        sync: false
      - key: AMAZON_SELLER_ID
        sync: false

  # ══════════════════════════════════════════════════════════════════════
  # Cron Jobs (PR DDD-1)
  # ══════════════════════════════════════════════════════════════════════
  # Migrated off Perplexity's cron scheduler so they run without depending
  # on the user's Perplexity credit balance. Each cron is a tiny alpine +
  # curl container that POSTs to an existing /api/cron/* endpoint on the
  # dmai-web service. Same X-Cron-Secret constant-time auth as before.
  #
  # Schedule notes:
  #   * All cron: expressions are in UTC (Render requirement).
  #   * BST months (Apr-Oct): backup at 00:45 BST = 23:45 UTC prev day.
  #     Render can't express "month range in local time", so we run at
  #     00:45 UTC year-round. UK viewers see:
  #       - BST: 01:45 local (was 00:45 in Perplexity BST cron)
  #       - GMT: 00:45 local (was 01:45 in Perplexity GMT cron)
  #     Close enough to the historical windows and easier to reason about.
  #   * Curriculum: 02:15 UTC year-round (was BST 02:15 UK / GMT 03:15 UK).
  # ──────────────────────────────────────────────────────────────────────

  - type: cron
    name: dmai-r2-backup
    env: docker
    dockerfilePath: ./cron/backup.Dockerfile
    dockerContext: ./cron
    # 00:45 UTC daily. See schedule notes above.
    schedule: "45 0 * * *"
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: TARGET_URL
        value: https://dmai-web.onrender.com/api/cron/backup/run

  - type: cron
    name: dmai-coding-curriculum
    env: docker
    dockerfilePath: ./cron/curriculum.Dockerfile
    dockerContext: ./cron
    # 02:15 UTC daily. See schedule notes above.
    schedule: "15 2 * * *"
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: TARGET_URL
        value: https://dmai-web.onrender.com/api/cron/coding-curriculum/study
