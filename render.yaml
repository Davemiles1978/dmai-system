services:
  # MAIN WEB SERVICE - Use dmai_core_complete.py (not dmai_web.py)
  - type: web
    name: dmai-web
    runtime: python
    repo: https://github.com/Davemiles1978/dmai-system
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      playwright install chromium
      mkdir -p data/backups data/synthetic data/phase11
    startCommand: gunicorn dmai_core_complete:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 5001
      - key: MASTER_PASSWORD
        value: Talula.78
      - key: RENDER
        value: true
      - key: USE_POSTGRESQL
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN_MAIN
        sync: false
      - key: GITHUB_TOKEN_SECONDARY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
    healthCheckPath: /health

  # TELEGRAM BOT WORKER
  - type: worker
    name: dmai-telegram
    runtime: python
    repo: https://github.com/Davemiles1978/dmai-system
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python3 telegram_bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RENDER
        value: true

  # CRON JOB - Weekly GitHub Starred Repos Check
  - type: cron-job
    name: dmai-github-star-check
    runtime: python
    repo: https://github.com/Davemiles1978/dmai-system
    region: frankfurt
    branch: main
    schedule: "0 0 * * 1"  # Every Monday at 00:00 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python3 scripts/scheduled_github_ingest.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RENDER
        value: true
      - key: DMAI_URL
        value: https://dmai-web.onrender.com
      - key: GITHUB_USER
        value: Davemiles1978
      - key: GITHUB_TOKEN
        sync: false
