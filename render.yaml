services:
  # MAIN WEB SERVICE - Complete Unified DMAI System
  - type: web
    name: dmai-complete
    runtime: python
    repo: https://github.com/Davemiles1978/dmai-system
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      mkdir -p data/backups data/synthetic data/phase11
    startCommand: gunicorn dmai_core_complete:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 5001
      - key: MASTER_PASSWORD
        value: Talula.78
      - key: RENDER
        value: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: USE_POSTGRESQL
        value: "false"
    healthCheckPath: /health

  # TELEGRAM WORKER - Keep your existing for Telegram commands
  - type: worker
    name: dmai-telegram-worker
    runtime: python
    repo: https://github.com/Davemiles1978/dmai-system
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python3 telegram_master_control.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RENDER
        value: true
