<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DMAI Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            color: #0f0;
            padding: 16px;
            padding-bottom: 80px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
            color: #0ff;
        }
        
        .card {
            background: #111;
            border: 1px solid #0f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .card-title {
            font-size: 16px;
            color: #0f0;
            margin-bottom: 12px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .metric-label {
            color: #888;
        }
        
        .metric-value {
            font-weight: bold;
            font-family: monospace;
        }
        
        .profit-positive {
            color: #0f0;
        }
        
        .profit-negative {
            color: #f00;
        }
        
        .progress-bar {
            background: #333;
            border-radius: 4px;
            height: 8px;
            margin: 8px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            background: #0f0;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
        
        .status-learning { background: #ff0; color: #000; }
        .status-researching { background: #fa0; color: #000; }
        .status-planned { background: #666; color: #fff; }
        
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-bottom: 12px;
        }
        
        button:active {
            opacity: 0.8;
        }
        
        .refresh-info {
            text-align: center;
            font-size: 10px;
            color: #666;
            margin-top: 16px;
        }
        
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .metric-value {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🧠 DMAI ADMIN DASHBOARD</h1>
    
    <button onclick="refreshData()">🔄 Refresh Now</button>
    <button onclick="resetTrading()" style="background:#f00; color:#fff;">🔁 Reset to $100,000</button>
    
    <div id="trading-card" class="card">
        <div class="card-title">💰 TRADING STATUS</div>
        <div id="trading-data">Loading...</div>
    </div>
    
    <div id="consciousness-card" class="card">
        <div class="card-title">🧠 CONSCIOUSNESS</div>
        <div id="consciousness-data">Loading...</div>
    </div>
    
    <div id="learning-card" class="card">
        <div class="card-title">📚 LEARNING PROGRESS</div>
        <div id="learning-data">Loading...</div>
    </div>
    
    <div class="refresh-info">
        Auto-refreshes every 30 seconds | Last update: <span id="last-update">-</span>
    </div>
</div>

<script>
    async function fetchData() {
        try {
            const response = await fetch('/api/admin/dashboard');
            const data = await response.json();
            updateUI(data);
            document.getElementById('last-update').innerText = new Date().toLocaleTimeString();
        } catch (error) {
            console.error('Fetch error:', error);
            document.getElementById('trading-data').innerHTML = '<div class="metric"><span class="metric-label">Error</span><span class="metric-value">Failed to load data</span></div>';
        }
    }
    
    function updateUI(data) {
        // Trading data
        if (data.trading && data.trading.success) {
            const profit = data.trading.profit;
            const profitClass = profit >= 0 ? 'profit-positive' : 'profit-negative';
            document.getElementById('trading-data').innerHTML = `
                <div class="metric"><span class="metric-label">Equity</span><span class="metric-value">$${data.trading.equity.toLocaleString()}</span></div>
                <div class="metric"><span class="metric-label">Cash</span><span class="metric-value">$${data.trading.cash.toLocaleString()}</span></div>
                <div class="metric"><span class="metric-label">P&L</span><span class="metric-value ${profitClass}">$${profit.toLocaleString()} (${data.trading.profit_percent}%)</span></div>
                <div class="metric"><span class="metric-label">Open Positions</span><span class="metric-value">${data.trading.positions_count}</span></div>
                <div class="metric"><span class="metric-label">Reset P&L</span><span class="metric-value">$${data.trading.reset_pnl.toLocaleString()}</span></div>
            `;
        } else if (data.trading && data.trading.error) {
            document.getElementById('trading-data').innerHTML = `<div class="metric"><span class="metric-label">Error</span><span class="metric-value">${data.trading.error}</span></div>`;
        }
        
        // Consciousness
        if (data.consciousness) {
            const consciousness = data.consciousness;
            document.getElementById('consciousness-data').innerHTML = `
                <div class="metric"><span class="metric-label">Consciousness</span><span class="metric-value">${consciousness}%</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width: ${consciousness}%"></div></div>
            `;
        }
        
        // Learning progress
        if (data.learning) {
            let html = '';
            for (const [strategy, info] of Object.entries(data.learning)) {
                const statusClass = info.status === 'learning' ? 'status-learning' : (info.status === 'researching' ? 'status-researching' : 'status-planned');
                html += `
                    <div class="metric">
                        <span class="metric-label">${strategy}</span>
                        <span class="metric-value">${info.mastery}% <span class="status-badge ${statusClass}">${info.status}</span></span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width: ${info.mastery}%"></div></div>
                `;
            }
            document.getElementById('learning-data').innerHTML = html;
        }
    }
    
    async function resetTrading() {
        if (confirm('⚠️ Reset trading to $100,000? This will close all positions.')) {
            document.getElementById('trading-data').innerHTML = '<div class="metric"><span class="metric-label">Resetting...</span></div>';
            try {
                const response = await fetch('/api/admin/trading/reset', { method: 'POST' });
                const result = await response.json();
                if (result.success) {
                    alert('Trading reset to $100,000');
                    refreshData();
                } else {
                    alert('Reset failed: ' + result.error);
                }
            } catch (error) {
                alert('Reset error: ' + error);
            }
        }
    }
    
    async function refreshData() {
        await fetchData();
    }
    
    // Auto-refresh every 30 seconds
    fetchData();
    setInterval(fetchData, 30000);
</script>
</body>
</html>
