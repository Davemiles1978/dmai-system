<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alex Riviera — AI Assistant</title>
  <style>
    :root {
      --bg:         #0a0a0f;
      --surface:    #111118;
      --surface2:   #18181f;
      --border:     #1e1e2e;
      --accent:     #6c63ff;
      --accent-dim: #4e47c4;
      --green:      #00d4aa;
      --text:       #e0dff5;
      --text-muted: #7c7b9a;
      --text-faint: #3a3a52;
      --radius:     12px;
      --radius-sm:  8px;
      --shadow:     0 4px 24px rgba(0,0,0,0.5);
      --glow:       0 0 28px rgba(108,99,255,0.15);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
    }
    button { cursor: pointer; font: inherit; border: none; background: none; }
    input, textarea { font: inherit; }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(10,10,15,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 1.25rem;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-brand {
      display: flex; align-items: center; gap: 10px;
    }
    .avatar-ring {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--green));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(108,99,255,0.4);
    }
    .brand-text .name { font-size: 15px; font-weight: 700; color: var(--text); }
    .brand-text .tagline { font-size: 11px; color: var(--text-muted); }
    .status-pill {
      display: flex; align-items: center; gap: 5px;
      background: rgba(0,212,170,0.08);
      border: 1px solid rgba(0,212,170,0.2);
      border-radius: 20px; padding: 4px 10px;
      font-size: 11px; color: var(--green);
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    /* ── Chat layout ── */
    .chat-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 0 1rem;
    }
    .messages {
      flex: 1;
      padding: 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }

    /* ── Welcome card ── */
    .welcome {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      text-align: center;
      margin-bottom: 0.5rem;
      box-shadow: var(--glow);
    }
    .welcome-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6c63ff 0%, #00d4aa 100%);
      margin: 0 auto 1rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: #fff;
      box-shadow: 0 0 24px rgba(108,99,255,0.35);
    }
    .welcome h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .welcome p  { font-size: 13px; color: var(--text-muted); line-height: 1.6; max-width: 480px; margin: 0 auto; }
    .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-top: 1.25rem;
    }
    .suggest-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      color: var(--text-muted);
      transition: all 150ms ease;
    }
    .suggest-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(108,99,255,0.08);
    }

    /* ── Message bubbles ── */
    .msg {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      animation: fadeUp 200ms ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user  { flex-direction: row-reverse; }
    .msg-icon {
      width: 30px; height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
    }
    .msg.user  .msg-icon { background: var(--accent); color: #fff; }
    .msg.bot   .msg-icon { background: linear-gradient(135deg,#6c63ff,#00d4aa); color: #fff; }
    .msg-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
    }
    .msg.user .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .msg-time {
      font-size: 10px;
      color: var(--text-faint);
      margin-top: 4px;
      text-align: right;
    }
    .msg.bot .msg-time { text-align: left; }

    /* ── Typing indicator ── */
    .typing-indicator {
      display: none;
      align-items: center; gap: 10px;
    }
    .typing-indicator.active { display: flex; }
    .typing-dots {
      display: flex; gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
    }
    .typing-dots span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-6px); }
    }

    /* ── Input bar ── */
    .input-bar {
      padding: 1rem 0 1.25rem;
      position: sticky;
      bottom: 0;
      background: linear-gradient(to top, var(--bg) 80%, transparent);
    }
    .input-form {
      display: flex; gap: 8px; align-items: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .input-form:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.12);
    }
    #msg-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      max-height: 140px;
      min-height: 22px;
      overflow-y: auto;
      padding: 0;
    }
    #msg-input::placeholder { color: var(--text-faint); }
    #send-btn {
      width: 36px; height: 36px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 150ms ease, transform 100ms ease;
    }
    #send-btn:hover  { background: var(--accent-dim); }
    #send-btn:active { transform: scale(0.93); }
    #send-btn:disabled { opacity: 0.4; pointer-events: none; }
    .input-hint {
      font-size: 11px; color: var(--text-faint);
      text-align: center; margin-top: 6px;
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-brand">
    <div class="avatar-ring">AR</div>
    <div class="brand-text">
      <div class="name">Alex Riviera</div>
      <div class="tagline">AI Assistant</div>
    </div>
  </div>
  <div class="status-pill">
    <div class="dot"></div>
    <span id="status-label">Online</span>
  </div>
</header>

<!-- Chat -->
<div class="chat-wrap">
  <div class="messages" id="messages">

    <!-- Welcome card -->
    <div class="welcome" id="welcome-card">
      <div class="welcome-avatar">AR</div>
      <h2>Hi, I'm Alex Riviera</h2>
      <p>Writer, producer, and AI assistant. I can help with creative projects, answer questions, discuss ideas, or just have a conversation. What's on your mind?</p>
      <div class="suggestions">
        <button class="suggest-btn" onclick="sendSuggestion('Tell me about yourself')">Tell me about yourself</button>
        <button class="suggest-btn" onclick="sendSuggestion('What can you create?')">What can you create?</button>
        <button class="suggest-btn" onclick="sendSuggestion('What topics do you know?')">What topics do you know?</button>
        <button class="suggest-btn" onclick="sendSuggestion('Help me write something')">Help me write something</button>
      </div>
    </div>

    <!-- Typing indicator -->
    <div class="msg bot typing-indicator" id="typing">
      <div class="msg-icon">AR</div>
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

  </div>

  <!-- Input -->
  <div class="input-bar">
    <form class="input-form" id="chat-form" onsubmit="return false;">
      <textarea
        id="msg-input"
        placeholder="Message Alex…"
        rows="1"
        autocomplete="off"
        spellcheck="true"
      ></textarea>
      <button id="send-btn" type="submit" aria-label="Send">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M14 8L2 2l2.5 6L2 14l12-6z" fill="currentColor"/>
        </svg>
      </button>
    </form>
    <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
  </div>
</div>

<script>
  const API = '/api/chat';
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('msg-input');
  const sendBtn    = document.getElementById('send-btn');
  const typingEl   = document.getElementById('typing');
  const statusEl   = document.getElementById('status-label');

  // ── Auto-resize textarea ──────────────────────────────────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  // ── Enter key ─────────────────────────────────────────────────────────────
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  document.getElementById('chat-form').addEventListener('submit', e => {
    e.preventDefault();
    sendMessage();
  });

  // ── Suggestions ───────────────────────────────────────────────────────────
  function sendSuggestion(text) {
    inputEl.value = text;
    sendMessage();
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function appendMsg(role, text) {
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;
    const icon = document.createElement('div');
    icon.className = 'msg-icon';
    icon.textContent = role === 'user' ? 'You' : 'AR';
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = now();
    const inner = document.createElement('div');
    inner.appendChild(bubble);
    inner.appendChild(time);
    msg.appendChild(icon);
    msg.appendChild(inner);
    // Insert before typing indicator
    messagesEl.insertBefore(msg, typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return msg;
  }

  function setTyping(on) {
    typingEl.classList.toggle('active', on);
    sendBtn.disabled = on;
    if (on) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Send ──────────────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    // Hide welcome card on first message
    const welcome = document.getElementById('welcome-card');
    if (welcome) welcome.style.display = 'none';

    inputEl.value = '';
    inputEl.style.height = 'auto';

    appendMsg('user', text);
    setTyping(true);

    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      setTyping(false);
      const reply = data.response || data.error || 'No response received.';
      appendMsg('bot', reply);
    } catch (err) {
      setTyping(false);
      appendMsg('bot', 'Connection error — please try again.');
      statusEl.textContent = 'Reconnecting…';
      setTimeout(checkStatus, 3000);
    }
  }

  // ── Status check ──────────────────────────────────────────────────────────
  async function checkStatus() {
    try {
      const r = await fetch('/health');
      const d = await r.json();
      statusEl.textContent = d.status === 'healthy' ? 'Online' : 'Degraded';
    } catch {
      statusEl.textContent = 'Offline';
    }
  }

  checkStatus();
</script>
</body>
</html>
